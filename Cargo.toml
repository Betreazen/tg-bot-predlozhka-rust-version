[package]
name = "tg-bot-predlozhka"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Telegram bot for collecting and moderating user-submitted content"
publish = false

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "sync"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
jiff = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"

[profile.release]
strip = true
